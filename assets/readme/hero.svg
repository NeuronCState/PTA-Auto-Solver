<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">PTA Auto Solver — PTA 的 AI 辅助答题脚本</title>
  <desc id="desc">一个黑白界面风格的项目标题：在 PTA 页面提取题目、调用所选 AI 模型、写入编辑器，并在需要时等待评分后继续下一题。</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f1ef"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="28" fill="url(#paper)"/>
  <rect x="24" y="24" width="1152" height="332" rx="20" fill="none" stroke="#d8d8d4" stroke-width="2"/>
  <g fill="#111111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="64" y="82" font-size="18" font-weight="700" letter-spacing="3">TAMPERMONKEY · PTA · AI ASSISTANT</text>
    <text x="64" y="166" font-size="64" font-weight="800" letter-spacing="-2">PTA Auto Solver</text>
    <text x="64" y="212" font-size="27" font-weight="600">从题干到评分的一条本地工作流。</text>
    <text x="64" y="256" fill="#696967" font-size="20">DeepSeek · MiMo · OpenRouter　/　v1.5.0</text>
  </g>
  <g transform="translate(768 70)">
    <rect x="0" y="0" width="344" height="238" rx="22" fill="#101010"/>
    <g fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
      <text x="28" y="43" font-size="22" font-weight="800">解题流程</text>
      <text x="28" y="74" font-size="18" fill="#bdbdb9">从题目到可检查的结果</text>
    </g>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">
      <rect x="28" y="98" width="102" height="42" rx="12" fill="#ffffff"/>
      <text x="50" y="126" fill="#111111">读取题目</text>
      <path d="M142 119h25" stroke="#8f8f8c" stroke-width="3"/>
      <path d="M162 113l7 6-7 6" fill="none" stroke="#8f8f8c" stroke-width="3"/>
      <rect x="178" y="98" width="126" height="42" rx="12" fill="#ffffff"/>
      <text x="198" y="126" fill="#111111">请求模型</text>
      <rect x="28" y="160" width="112" height="42" rx="12" fill="#292929" stroke="#747470"/>
      <text x="48" y="188" fill="#ffffff">写入编辑器</text>
      <path d="M152 181h25" stroke="#8f8f8c" stroke-width="3"/>
      <path d="M172 175l7 6-7 6" fill="none" stroke="#8f8f8c" stroke-width="3"/>
      <rect x="188" y="160" width="116" height="42" rx="12" fill="#ffffff"/>
      <text x="210" y="188" fill="#111111">等待评分</text>
    </g>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#666662">
    <text x="64" y="326">LOCAL SETTINGS · API KEY STAYS IN YOUR BROWSER</text>
    <text x="1080" y="326" text-anchor="end">01 / 04</text>
  </g>
</svg>
