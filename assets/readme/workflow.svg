<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">PTA Auto Solver 解题流程</title>
  <desc id="desc">四个连续步骤：进入具体题目，选择模型并开始，提取题干并写入答案，提交后读取评分。四张卡片采用相同宽度，均完整保留在画布安全边距内。</desc>
  <rect width="1200" height="350" rx="28" fill="#111111"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="60" y="70" fill="#ffffff" font-size="38" font-weight="800">把重复流程留给脚本，把判断留给你</text>
    <text x="60" y="105" fill="#b8b8b4" font-size="20">每一步都在 PTA 页面中完成；自动提交会产生真实记录。</text>
  </g>
  <g transform="translate(60 150)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <g><rect width="240" height="140" rx="18" fill="#f5f5f2"/><text x="24" y="37" fill="#6b6b67" font-size="18" font-weight="700">01</text><text x="24" y="78" fill="#111111" font-size="25" font-weight="800">进入具体题目</text><text x="24" y="110" fill="#555552" font-size="18">读取题号与总进度</text></g>
    <path d="M250 70h20" stroke="#777773" stroke-width="3"/><path d="M264 64l7 6-7 6" fill="none" stroke="#777773" stroke-width="3"/>
    <g transform="translate(280)"><rect width="240" height="140" rx="18" fill="#f5f5f2"/><text x="24" y="37" fill="#6b6b67" font-size="18" font-weight="700">02</text><text x="24" y="78" fill="#111111" font-size="25" font-weight="800">选择模型并开始</text><text x="24" y="110" fill="#555552" font-size="18">本地保存 API Key</text></g>
    <path d="M530 70h20" stroke="#777773" stroke-width="3"/><path d="M544 64l7 6-7 6" fill="none" stroke="#777773" stroke-width="3"/>
    <g transform="translate(560)"><rect width="240" height="140" rx="18" fill="#f5f5f2"/><text x="24" y="37" fill="#6b6b67" font-size="18" font-weight="700">03</text><text x="24" y="78" fill="#111111" font-size="25" font-weight="800">提取并写入答案</text><text x="24" y="110" fill="#555552" font-size="18">解析题干与代码框架</text></g>
    <path d="M810 70h20" stroke="#777773" stroke-width="3"/><path d="M824 64l7 6-7 6" fill="none" stroke="#777773" stroke-width="3"/>
    <g transform="translate(840)"><rect width="240" height="140" rx="18" fill="#f5f5f2"/><text x="24" y="37" fill="#6b6b67" font-size="18" font-weight="700">04</text><text x="24" y="78" fill="#111111" font-size="25" font-weight="800">提交并读取评分</text><text x="24" y="110" fill="#555552" font-size="18">满分后可继续下一题</text></g>
  </g>
</svg>
